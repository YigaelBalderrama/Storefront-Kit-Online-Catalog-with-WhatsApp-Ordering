<header class="store-header">
  <nav class="store-header__navigation" [attr.aria-label]="copy.navigation">
    <a class="store-header__brand" routerLink="/catalogo">{{ copy.brand }}</a>
    <div class="store-header__actions">
      <a
        mat-icon-button
        routerLink="/carrito"
        [attr.aria-label]="copy.cart + ' (' + count() + ')'"
        [matTooltip]="copy.cart + ' (' + count() + ')'"
        ><app-store-icon name="cart"
      /></a>
      <button
        mat-icon-button
        type="button"
        [matMenuTriggerFor]="accountMenu"
        [attr.aria-label]="copy.account"
        [matTooltip]="copy.account"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #accountMenu="matMenu" xPosition="before">
        <a mat-menu-item routerLink="/profile"
          ><mat-icon>account_circle</mat-icon><span>{{ copy.account }}</span></a
        >
        <a mat-menu-item routerLink="/profile"
          ><mat-icon>person</mat-icon><span>{{ copy.profile }}</span></a
        >
        <button mat-menu-item type="button" (click)="logout.emit()">
          <mat-icon>logout</mat-icon><span>{{ copy.logout }}</span>
        </button>
      </mat-menu>
    </div>
  </nav>
</header>
