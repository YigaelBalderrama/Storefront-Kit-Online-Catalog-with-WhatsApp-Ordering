<header class="store-header">
  <nav class="store-header__navigation" [attr.aria-label]="copy.navigation">
    <a class="store-header__brand" routerLink="/catalogo">{{ copy.brand }}</a>
    <div class="store-header__actions">
      <a
        mat-icon-button
        class="store-header__action"
        routerLink="/carrito"
        [attr.aria-label]="copy.cart + ' (' + count() + ')'"
        [matTooltip]="copy.cart + ' (' + count() + ')'"
        ><mat-icon>shopping_cart</mat-icon></a
      >
      <button
        mat-icon-button
        class="store-header__action"
        type="button"
        [matMenuTriggerFor]="eventsMenu"
        [class.store-header__action--active]="eventsRouteActive()"
        [attr.aria-label]="copy.openEventsMenu"
        [matTooltip]="copy.event"
      >
        <mat-icon>menu_book</mat-icon>
      </button>
      <mat-menu #eventsMenu="matMenu">
        <a
          mat-menu-item
          routerLink="/eventos"
          routerLinkActive="store-header__menu-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
          ><mat-icon>event</mat-icon><span>{{ copy.event }}</span></a
        >
        <a
          mat-menu-item
          routerLink="/eventos/especial"
          routerLinkActive="store-header__menu-item--active"
          ><mat-icon>star</mat-icon><span>{{ copy.specialEvents }}</span></a
        >
      </mat-menu>
      <button
        mat-icon-button
        class="store-header__action"
        type="button"
        [matMenuTriggerFor]="accountMenu"
        [attr.aria-label]="copy.account"
        [matTooltip]="copy.account"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #accountMenu="matMenu" xPosition="before">
        <a mat-menu-item routerLink="/profile"
          ><mat-icon>account_circle</mat-icon><span>{{ copy.account }}</span></a
        >
        <button mat-menu-item type="button" (click)="logout.emit()">
          <mat-icon>logout</mat-icon><span>{{ copy.logout }}</span>
        </button>
      </mat-menu>
    </div>
  </nav>
</header>
