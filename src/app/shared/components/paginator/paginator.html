<nav class="paginator" [attr.aria-label]="copy.label">
  <div class="paginator__navigation">
    <app-icon-button
      icon="back"
      [label]="copy.previous"
      [disabled]="page() <= 1"
      (activated)="pageChanged.emit(page() - 1)"
    />
    <span aria-live="polite">{{ copy.page }} {{ page() }} {{ copy.of }} {{ pages() }}</span>
    <app-icon-button
      icon="next"
      [label]="copy.next"
      [disabled]="page() >= pages()"
      (activated)="pageChanged.emit(page() + 1)"
    />
  </div>
</nav>
