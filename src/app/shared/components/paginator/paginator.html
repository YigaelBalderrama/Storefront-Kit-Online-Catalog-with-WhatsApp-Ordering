<nav class="paginator" [attr.aria-label]="copy.label">
  <mat-form-field class="paginator__size" subscriptSizing="dynamic">
    <mat-label>{{ copy.size }}</mat-label>
    <mat-select [value]="pageSize()" (selectionChange)="sizeChanged.emit($event.value)">
      @for (size of pageSizes(); track size) {
        <mat-option [value]="size">{{ size }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <div class="paginator__navigation">
    <button mat-stroked-button [disabled]="page() <= 1" (click)="pageChanged.emit(page() - 1)">
      {{ copy.previous }}
    </button>
    <span aria-live="polite">{{ copy.page }} {{ page() }} {{ copy.of }} {{ pages() }}</span>
    <button
      mat-stroked-button
      [disabled]="page() >= pages()"
      (click)="pageChanged.emit(page() + 1)"
    >
      {{ copy.next }}
    </button>
  </div>
</nav>
